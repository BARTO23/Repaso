<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f5f4" />
  <title>Clientes | Lex &amp; Asociados</title>
  <style>
/* Lex: la app funcional con el aspecto de la demo de stageshow
   (tokens tomados de src/scene/lex.css) */
:root {
  --well: #ececeb;
  --canvas: #f5f5f4;
  --surface: #fdfdfc;
  --raised: #ffffff;
  --line: #e6e6e4;
  --text: #6c6c69;
  --strong: #1d1d1c;
  --faint: #a2a29e;
  --icon: #7a7a76;
  --nav-active: #e9e9e7;
  --row-hover: #f3f3f2;
  --accent: #2e6b4f;
  --accent-hover: #255a42;
  --accent-soft: rgba(46, 107, 79, 0.12);
  --active: #2e7d4f;
  --review: #c98a14;
  --potential: #8b8b86;
  --inactive: #c4c4c0;
  --danger: #b42318;
  --ease: cubic-bezier(0.45, 0, 0.1, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 13px;
  color: var(--strong);
  background: var(--canvas);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Marco ---------- */
.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); height: 100vh; height: 100dvh; }
.side { display: flex; flex-direction: column; gap: 20px; padding: 14px 10px; overflow-y: auto; }
.workspace { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; font-weight: 600; }
.group { display: flex; flex-direction: column; gap: 2px; }
.section { height: 24px; display: flex; align-items: center; padding: 0 8px; font-size: 12px; font-weight: 500; color: var(--faint); }
.nav { display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 8px; border-radius: 6px; color: #5c5c59; font-weight: 500; text-align: left; transition: background-color 0.15s; }
.nav:hover { background: var(--row-hover); }
.nav[aria-current="page"] { background: var(--nav-active); color: var(--strong); }
.nav .i { color: var(--icon); }
.nav[aria-current="page"] .i { color: var(--strong); }
.nav .count { margin-left: auto; font-size: 12px; color: var(--text); font-variant-numeric: tabular-nums; }

.panel {
  display: flex; flex-direction: column; min-width: 0;
  margin: 8px 8px 0 0; border-radius: 10px 10px 0 0;
  background: var(--surface);
  box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0, 0, 0, 0.03);
  overflow: hidden;
}
.bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 52px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.bar h1 { margin: 0; font-size: 14px; font-weight: 600; }
.tabs { display: flex; gap: 4px; }
.tab { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; box-shadow: inset 0 0 0 1px var(--line); font-size: 12px; font-weight: 500; color: var(--text); transition: background-color 0.15s, color 0.15s; }
.tab:hover { color: var(--strong); }
.tab[aria-pressed="true"] { background: #efefee; box-shadow: none; color: var(--strong); }
.tab span { color: var(--faint); font-variant-numeric: tabular-nums; }
.spacer { flex: 1; }
.search { position: relative; display: flex; align-items: center; }
.search .i { position: absolute; left: 9px; color: var(--icon); pointer-events: none; }
.search input {
  width: 240px; height: 30px; padding: 0 30px 0 30px;
  border: 0; border-radius: 8px; background: var(--raised);
  box-shadow: inset 0 0 0 1px var(--line);
  font-size: 12.5px; outline: none;
  transition: box-shadow 0.15s;
}
.search input::placeholder { color: var(--faint); }
.search input:focus { box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3px var(--accent-soft); }
.search kbd { position: absolute; right: 8px; font-family: inherit; font-size: 11px; color: var(--faint); }
.search input:not(:placeholder-shown) + kbd { display: none; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 8px; font-size: 12.5px; font-weight: 500; transition: background-color 0.15s, box-shadow 0.15s; white-space: nowrap; }
.btn-primary { color: #fff; background: var(--accent); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); }
.btn-secondary:hover { background: var(--row-hover); }
.btn .i { width: 14px; height: 14px; }

/* ---------- Lista ---------- */
.content { position: relative; flex: 1; min-height: 0; display: flex; }
.list { flex: 1; overflow-y: auto; padding: 6px; }
.group-head { display: flex; align-items: center; height: 32px; padding: 0 12px; font-size: 12px; font-weight: 500; color: var(--text); }
.row {
  display: grid; grid-template-columns: 14px minmax(0, 1fr) 136px 20px 84px;
  align-items: center; column-gap: 12px;
  width: 100%; height: 38px; padding: 0 12px; border-radius: 6px; text-align: left;
  transition: background-color 0.15s;
}
.row:hover { background: var(--row-hover); }
.row[aria-current="true"] { background: var(--nav-active); }
.row .name { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 500; }
.row .name small { margin-left: 8px; font-weight: 400; color: var(--text); }
.row .when { justify-self: end; font-size: 12px; color: var(--text); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .when[data-soon] { color: var(--active); font-weight: 500; }
.row .ref { justify-self: end; font-size: 12px; color: var(--text); font-variant-numeric: tabular-nums; }
.chip { display: inline-flex; align-items: center; gap: 6px; justify-self: end; max-width: 100%; height: 22px; padding: 0 9px 0 8px; border-radius: 11px; box-shadow: inset 0 0 0 1px #e3e3e1; font-size: 12px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; }
.chip i { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.avatar { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font-size: 10px; font-weight: 600; color: #fff; background: var(--c, #8d7fae); }
.avatar.lg { width: 36px; height: 36px; font-size: 14px; }
.status { width: 14px; height: 14px; overflow: visible; }
.status circle { fill: none; stroke-width: 1.5; stroke: var(--inactive); }
.status[data-s="Activo"] circle { stroke: var(--active); }
.status[data-s="Activo"] circle.dot { fill: var(--active); stroke: none; }
.status[data-s="En revisión"] circle { stroke: var(--review); }
.status[data-s="Potencial"] circle { stroke: var(--potential); stroke-dasharray: 2.1 1.5; }
.empty { padding: 48px 16px; text-align: center; color: var(--text); }
.empty strong { display: block; margin-bottom: 4px; font-size: 14px; color: var(--strong); }
.empty .btn { margin-top: 14px; }

/* ---------- Ficha ---------- */
.peek {
  width: 360px; flex: none; overflow-y: auto;
  display: flex; flex-direction: column; gap: 18px;
  padding: 18px 20px 24px;
  background: var(--surface);
  box-shadow: -1px 0 0 var(--line), -24px 0 48px -24px rgba(0, 0, 0, 0.18);
  animation: peek-in 0.5s var(--ease);
}
@keyframes peek-in { from { transform: translateX(40px); opacity: 0; } }
.peek[hidden] { display: none; }
.peek-head { display: flex; align-items: center; gap: 12px; }
.peek-head > div { flex: 1; min-width: 0; }
.peek-head h2 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.3; }
.peek-head p { margin: 2px 0 0; font-size: 12.5px; color: var(--text); }
.icon-btn { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; color: var(--icon); flex: none; }
.icon-btn:hover { background: var(--row-hover); color: var(--strong); }
.badges { display: flex; flex-wrap: wrap; gap: 8px; }
.badge { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; font-weight: 500; }
.badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge[data-s="Activo"] { color: var(--active); background: rgba(46, 125, 79, 0.1); }
.badge[data-s="En revisión"] { color: #9a6a0f; background: rgba(201, 138, 20, 0.12); }
.badge[data-s="Potencial"] { color: #5f5f5b; background: rgba(0, 0, 0, 0.06); }
.badge[data-s="Inactivo"] { color: #8b8b86; background: rgba(0, 0, 0, 0.05); }
.hearing { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding-top: 16px; border-top: 1px solid var(--line); }
.hearing .label { font-size: 12px; font-weight: 500; color: var(--text); }
.hearing .when { font-size: 15px; font-weight: 600; }
.hearing .where { font-size: 12.5px; color: var(--text); }
.hearing .btn { margin-top: 10px; }
.facts { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px 12px; margin: 0; padding-top: 16px; border-top: 1px solid var(--line); }
.facts dt { color: var(--text); }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.facts a { color: var(--strong); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.facts a:hover { text-decoration-color: currentColor; }
.cases h3 { margin: 0 0 6px; font-size: 12px; font-weight: 500; color: var(--text); }
.case { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.case:last-child { border-bottom: 0; }
.case span { min-width: 0; }
.case small { display: block; color: var(--text); }
.case .prio { font-size: 12px; color: var(--text); }
.case .prio[data-high] { color: var(--danger); font-weight: 500; }
.notes { margin: 0; color: var(--text); line-height: 1.5; }

/* ---------- Diálogo y avisos ---------- */
dialog { width: min(440px, calc(100vw - 32px)); padding: 0; border: 0; border-radius: 12px; background: var(--surface); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.07), 0 24px 56px -16px rgba(0, 0, 0, 0.2); }
dialog::backdrop { background: rgba(28, 28, 26, 0.18); }
dialog form { display: flex; flex-direction: column; gap: 14px; padding: 20px; }
dialog h2 { margin: 0; font-size: 15px; }
dialog p { margin: -8px 0 0; color: var(--text); }
dialog label { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; font-weight: 500; }
dialog input, dialog select { height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); outline: none; font-size: 13px; }
dialog input:focus, dialog select:focus { box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3px var(--accent-soft); }
dialog .err { display: none; font-weight: 400; color: var(--danger); }
dialog label[data-invalid] input { box-shadow: inset 0 0 0 1px var(--danger); }
dialog label[data-invalid] .err { display: block; }
dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
.toasts { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 50; }
.toast { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px; background: var(--strong); color: #fff; font-size: 13px; box-shadow: 0 12px 32px -12px rgba(0, 0, 0, 0.4); animation: toast-in 0.3s var(--ease); }
.toast button { color: #fff; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } }

/* ---------- Pantallas estrechas ---------- */
@media (max-width: 1000px) {
  .row { grid-template-columns: 14px minmax(0, 1fr) 20px 72px; }
  .row .chip, .row .chip-slot { display: none; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .side { display: none; }
  .panel { margin: 0; border-radius: 0; }
  .bar { padding: 10px 12px; }
  .search { order: 5; flex: 1 1 100%; }
  .search input { width: 100%; font-size: 16px; height: 38px; }
  .peek { position: absolute; inset: 0; width: auto; z-index: 5; }
  .row { height: 44px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
.facts dd a { display: inline-block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; vertical-align: bottom; }
.facts dd { overflow-wrap: normal; }
@media (max-width: 760px), (pointer: coarse) { .search kbd { display: none; } .search input { padding-right: 10px; } }

</style>
</head>
<body>
  <div class="app">
    <aside class="side" aria-label="Navegación">
      <div class="workspace" translate="no">Lex &amp; Asociados</div>
      <div class="group">
        <button class="nav" data-soon="Bandeja"><svg class="i" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>Bandeja</button>
        <button class="nav" data-soon="Agenda"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Agenda</button>
      </div>

        <button class="nav" data-soon="Expedientes"><svg class="i" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>Expedientes</button>
        <button class="nav" data-soon="Documentos"><svg class="i" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/></svg>Documentos</button>
      </div>
    </aside>

    <main class="panel">
      <header class="bar">
        <h1>Clientes</h1>
        <div class="tabs" role="group" aria-label="Filtrar clientes">
          <button class="tab" data-tab="todos" aria-pressed="true">Todos <span id="cTodos"></span></button>
          <button class="tab" data-tab="activos" aria-pressed="false">Activos <span id="cActivos"></span></button>

        </div>
        <div class="spacer"></div>
        <div class="search" role="search">
          <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

        </div>
        <button class="btn btn-primary" id="newBtn"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nuevo cliente</button>
      </header>
      <div class="content">
        <div class="list" id="list" aria-live="polite"></div>
        <aside class="peek" id="peek" hidden aria-label="Ficha del cliente"></aside>
      </div>
    </main>
  </div>

  <dialog id="newDialog" aria-labelledby="newTitle">
    <form id="newForm" novalidate>
      <h2 id="newTitle">Nuevo cliente</h2>
      <p>Podrás completar el resto de datos después.</p>
      <label id="lNombre">Nombre o razón social
        <input name="nombre" autocomplete="organization" placeholder="Grupo Horizonte SAS…" />
        <span class="err">Escribe al menos 3 caracteres.</span>
      </label>
      <label id="lEmail">Correo
        <input name="email" type="email" inputmode="email" autocomplete="email" spellcheck="false" placeholder="contacto@empresa.com…" />
        <span class="err">Usa el formato nombre@dominio.com.</span>
      </label>
      <label>Área de práctica
        <select name="area" id="fArea"></select>
      </label>
      <div class="actions">
        <button type="button" class="btn btn-secondary" id="cancelNew">Cancelar</button>
        <button type="button" class="btn btn-primary" id="createBtn">Crear cliente</button>
      </div>
    </form>
  </dialog>
  <div class="toasts" id="toasts" aria-live="polite"></div>

    ['Ricardo Salazar Pinto',          'Persona', 'Civil'],
    ['Nova Capital Fintech',           'Empresa', 'Corporativo'],
    ['Isabel Navarro Quintero',        'Persona', 'Familia'],
    ['Estudio Creativo Prisma',        'Empresa', 'Propiedad Intelectual'],
    ['Mateo Castillo Ramos',           'Persona', 'Penal'],
    ['Transportes Cordillera',         'Empresa', 'Laboral'],
    ['Gabriela Ospina Rivera',         'Persona', 'Inmobiliario'],
    ['Laboratorios Ámbar',             'Empresa', 'Penal'],
    ['Daniel Esteban Vélez',           'Persona', 'Tributario'],
  ];

  const slug = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '.').replace(/^\.|\.$/g, '');
  const today = new Date(2026, 10, 17);
  const daysAgo = (d) => new Date(today.getTime() - d * 864e5).toISOString().slice(0, 10);
  // Las audiencias solo caen en días hábiles
  const daysAhead = (d) => {
    const x = new Date(today.getTime() + d * 864e5);
    const w = x.getDay();
    if (w === 6) x.setDate(x.getDate() + 2);
    if (w === 0) x.setDate(x.getDate() + 1);
    return x.toISOString().slice(0, 10);
  };

  const clientes = BASE.map(([nombre, tipo, area], idx) => {
    const posibles = ABOGADOS.filter((a) => a.areas.includes(area));
    const abogado = (posibles.length ? pick(posibles) : pick(ABOGADOS)).id;
    const estado = idx < 3 ? 'Activo' : pick(['Activo', 'Activo', 'Activo', 'En revisión', 'Potencial', 'Inactivo']);
    const nCasos = estado === 'Potencial' ? int(0, 1) : estado === 'Inactivo' ? int(1, 2) : int(1, 4);
    const casos = Array.from({ length: nCasos }, (_, k) => ({
      id: `${idx}-${k}`,
      titulo: pick(CASOS[area]),
      expediente: `${int(2023, 2026)}-${String(int(100, 9999)).padStart(4, '0')}`,
      estado: estado === 'Inactivo' ? 'Cerrado' : pick(['Abierto', 'Abierto', 'En audiencia', 'En espera', 'Cerrado']),
      prioridad: pick(['Alta', 'Media', 'Media', 'Baja']),
      progreso: int(10, 100),
    }));
    const facturado = tipo === 'Empresa' ? int(40, 420) * 1e6 : int(6, 90) * 1e6;
    const dominio = tipo === 'Empresa' ? slug(nombre.split(' ').slice(0, 2).join(' ')).replace(/\./g, '') + '.com.co' : 'correo.co';
    const email = tipo === 'Empresa' ? `juridico@${dominio}` : `${slug(nombre.split(' ').slice(0, 2).join(' '))}@${dominio}`;
    const etiquetas = [...new Set(Array.from({ length: int(0, 2) }, () => pick(ETIQUETAS)))];
    const actividad = int(0, 40);

    return {
      id: 'c' + String(idx + 1).padStart(3, '0'),
      nombre, tipo, area, estado, abogado,
      contacto: tipo === 'Empresa' ? pick(['Ana Beltrán', 'Jorge Lozano', 'Marcela Duarte', 'Felipe Arango', 'Laura Pineda']) + ' (gerencia)' : '',
      email,
      telefono: `+57 3${int(0, 2)}${int(0, 9)} ${int(100, 999)} ${int(1000, 9999)}`,
      ciudad: pick(CIUDADES),
      documento: tipo === 'Empresa' ? `NIT ${int(800, 901)}.${int(100, 999)}.${int(100, 999)}-${int(0, 9)}` : `C.C. ${int(10, 99)}.${int(100, 999)}.${int(100, 999)}`,
      desde: daysAgo(int(30, 2200)),
      ultimaActividad: daysAgo(actividad),
      proximaAudiencia: estado === 'Activo' && rnd() > 0.35 ? daysAhead(int(0, 30)) : null,
      facturado,
      pendiente: estado === 'Potencial' ? 0 : Math.round(facturado * (rnd() * 0.35) / 1e5) * 1e5,
      satisfaccion: int(3, 5),
      favorito: rnd() > 0.78,
      etiquetas,
      casos,
      notas: pick([
        'Prefiere comunicación por correo. Reuniones de seguimiento quincenales.',
        'Cliente sensible a plazos; enviar reportes de avance cada viernes.',
        'Requiere aprobación de junta directiva para gastos superiores a 20 M.',
        'Contacto preferente por teléfono en horas de la mañana.',
        'Referido por cliente corporativo. Potencial de ampliar servicios.',
      ]),
      timeline: [
        { fecha: daysAgo(actividad), texto: pick(['Se radicó memorial ante el juzgado', 'Reunión de estrategia con el cliente', 'Se envió borrador de contrato', 'Se recibió respuesta de la contraparte']) },
        { fecha: daysAgo(actividad + int(3, 12)), texto: pick(['Se emitió factura de honorarios', 'Llamada de seguimiento', 'Se adjuntaron pruebas documentales', 'Revisión de poder especial']) },
        { fecha: daysAgo(actividad + int(15, 40)), texto: pick(['Firma de contrato de prestación de servicios', 'Primera consulta jurídica', 'Apertura de expediente']) },
      ],
    };
  });

  // Serie mensual (últimos 12 meses) para el dashboard
  const MESES = ['Dic', 'Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov'];
  const serie = MESES.map((m, i) => ({
    mes: m,
    nuevos: Math.round(4 + i * 0.6 + rnd() * 5),
    cerrados: Math.round(3 + i * 0.4 + rnd() * 4),
    ingresos: Math.round((180 + i * 14 + rnd() * 60) * 1e6),
  }));

  window.LEX_DATA = { AREAS, ESTADOS, ABOGADOS, clientes, serie, HOY: today.toISOString().slice(0, 10) };
})();

</script>
  <script>
/* Lex: directorio de clientes funcional, con el aspecto de la demo de stageshow */
'use strict';

const D = window.LEX_DATA;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s = '') => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* sin almacenamiento */ } },
};

let clients = store.get('lex-app-clients', null) || JSON.parse(JSON.stringify(D.clientes));
let reminders = store.get('lex-app-reminders', {});
const save = () => { store.set('lex-app-clients', clients); store.set('lex-app-reminders', reminders); };

const state = { q: '', tab: 'todos', open: null };

/* ---------- Formatos ---------- */
const HOY = D.HOY;
const parse = (s) => new Date(s + 'T00:00:00');
const days = (s) => Math.round((parse(s) - parse(HOY)) / 864e5);
const dfShort = new Intl.DateTimeFormat('es-CO', { day: 'numeric', month: 'short' });
const dfLong = new Intl.DateTimeFormat('es-CO', { weekday: 'long', day: 'numeric', month: 'long' });
const dfDate = new Intl.DateTimeFormat('es-CO', { day: 'numeric', month: 'long', year: 'numeric' });
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const whenShort = (s) => { const n = days(s); return n === 0 ? 'Hoy' : n === 1 ? 'Mañana' : n < 7 ? `En ${n} días` : dfShort.format(parse(s)); };
const hash = (s) => { let h = 7; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h; };
// Los datos no traen hora ni juzgado: se derivan del cliente, siempre iguales
const hearingTime = (c) => { const h = hash(c.id); return `${8 + (h % 8)}:${h % 2 ? '30' : '00'}`; };
const hearingCourt = (c) => `Juzgado ${(hash(c.nombre) % 18) + 1} ${c.area === 'Penal' ? 'Penal' : c.area === 'Laboral' ? 'Laboral' : 'Civil'} de ${c.ciudad}`;
const hasHearing = (c) => c.proximaAudiencia && days(c.proximaAudiencia) >= 0;

const AREA_COLOR = { Corporativo: '#4a77b4', Penal: '#b5473a', Laboral: '#b5793a', Familia: '#a2456e', Tributario: '#3f8f6a', 'Propiedad Intelectual': '#6a5fae', Inmobiliario: '#2f8a8f', Civil: '#7d7a4a' };
const LAWYER = (id) => D.ABOGADOS.find((a) => a.id === id) || D.ABOGADOS[0];
const lawyerColor = (a) => `hsl(${a.hue} 32% 52%)`;

const status = (s) => `<svg class="status" data-s="${esc(s)}" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.5"/>${s === 'Activo' ? '<circle class="dot" cx="7" cy="7" r="2.5"/>' : ''}</svg>`;
const chip = (area) => `<span class="chip" style="--c:${AREA_COLOR[area] || '#8b8b86'}"><i></i>${esc(area)}</span>`;
const avatar = (a, cls = '') => `<span class="avatar ${cls}" style="--c:${lawyerColor(a)}" title="${esc(a.titulo + ' ' + a.nombre)}" aria-hidden="true">${esc(a.nombre[0])}</span>`;

/* ---------- Filtrado ---------- */
const byTab = (c) => state.tab === 'activos' ? c.estado === 'Activo' : state.tab === 'audiencia' ? hasHearing(c) : true;
function matches(c, tokens) {
  if (!tokens.length) return true;
  const hay = norm([c.nombre, c.ciudad, c.area, c.documento, c.email, c.contacto, LAWYER(c.abogado).nombre].join(' '));
  return tokens.every((t) => hay.includes(t));
}

/* ---------- Lista ---------- */
function rowHTML(c) {
  const a = LAWYER(c.abogado);
  const when = hasHearing(c) ? whenShort(c.proximaAudiencia) : '';
  return `<button class="row" data-id="${c.id}" aria-current="${state.open === c.id}">
    ${status(c.estado)}
    <span class="name">${esc(c.nombre)}<span class="sr-only">, ${esc(c.estado)}</span></span>
    <span class="chip-slot">${chip(c.area)}</span>
    ${avatar(a)}
    <span class="when" ${hasHearing(c) && days(c.proximaAudiencia) < 7 ? 'data-soon' : ''}>${when ? `<span class="sr-only">Audiencia: </span>${when}` : ''}</span>
  </button>`;
}

function render() {
  const tokens = norm(state.q).split(/\s+/).filter(Boolean);
  const list = clients.filter((c) => byTab(c) && matches(c, tokens)).sort((x, y) => x.nombre.localeCompare(y.nombre, 'es'));
  let html = '';
  if (tokens.length) {
    // Al buscar, también aparecen los expedientes que coinciden (por título o por cliente)
    const cases = clients.filter(byTab).flatMap((c) => c.casos.map((k) => ({ k, c })))
      .filter(({ k, c }) => tokens.every((t) => norm(k.titulo + ' ' + k.expediente + ' ' + c.nombre).includes(t))).slice(0, 8);
    if (list.length) html += `<div class="group-head">Clientes</div>${list.map(rowHTML).join('')}`;
    if (cases.length) {
      html += `<div class="group-head">Expedientes</div>` + cases.map(({ k, c }) => `
        <button class="row" data-id="${c.id}">
          ${status(k.estado === 'Cerrado' ? 'Inactivo' : k.estado === 'En espera' ? 'En revisión' : 'Activo')}
          <span class="name">${esc(k.titulo)}<small>${esc(c.nombre)}</small></span>
          <span class="chip-slot"></span><span></span>
          <span class="ref">${esc(k.expediente)}</span>
        </button>`).join('');
    }
    if (!list.length && !cases.length) html = `<div class="empty"><strong>Nada coincide con “${esc(state.q)}”</strong>Revisa la ortografía o busca por ciudad, NIT o abogado.<br><button class="btn btn-secondary" data-clear>Borrar la búsqueda</button></div>`;
  } else {
    html = list.length ? list.map(rowHTML).join('') : `<div class="empty"><strong>No hay clientes en esta vista</strong>Prueba con otra pestaña.</div>`;
  }
  $('#list').innerHTML = html;

  const all = clients.length;
  $('#navCount').textContent = all;
  $('#cTodos').textContent = all;
  $('#cActivos').textContent = clients.filter((c) => c.estado === 'Activo').length;
  $('#cAud').textContent = clients.filter(hasHearing).length;
  document.querySelectorAll('.tab').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.tab === state.tab)));
}

/* ---------- Ficha ---------- */
function renderPeek() {
  const peek = $('#peek');
  const c = clients.find((x) => x.id === state.open);
  if (!c) { peek.hidden = true; document.title = 'Clientes | Lex & Asociados'; return; }
  const a = LAWYER(c.abogado);
  const reminded = !!reminders[c.id];
  const hearing = hasHearing(c) ? `
    <section class="hearing" aria-label="Próxima audiencia">
      <span class="label">Próxima audiencia</span>
      <span class="when">${days(c.proximaAudiencia) === 0 ? 'Hoy' : days(c.proximaAudiencia) === 1 ? 'Mañana' : cap(dfLong.format(parse(c.proximaAudiencia)))} a las ${hearingTime(c)}</span>
      <span class="where">${esc(hearingCourt(c))}</span>
      <button class="btn ${reminded ? 'btn-secondary' : 'btn-primary'}" data-remind="${c.id}" aria-pressed="${reminded}">
        ${reminded ? '<svg class="i" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>Recordatorio creado' : '<svg class="i" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>Recordarme'}
      </button>
    </section>` : `<section class="hearing"><span class="label">Próxima audiencia</span><span class="where">Sin audiencias programadas</span></section>`;

  peek.innerHTML = `
    <div class="peek-head">
      <span class="avatar lg" style="--c:${AREA_COLOR[c.area] || '#8b8b86'}" aria-hidden="true">${esc(c.nombre[0])}</span>
      <div><h2 id="peekTitle">${esc(c.nombre)}</h2><p>${c.tipo === 'Empresa' ? 'Empresa' : 'Persona natural'} en ${esc(c.ciudad)}</p></div>
      <button class="icon-btn" data-close aria-label="Cerrar ficha (Esc)"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="badges"><span class="badge" data-s="${esc(c.estado)}">${esc(c.estado)}</span>${chip(c.area)}</div>
    ${hearing}
    <dl class="facts">
      <dt>Correo</dt><dd><a href="mailto:${esc(c.email)}">${esc(c.email)}</a></dd>
      <dt>Teléfono</dt><dd><a href="tel:${esc(c.telefono.replace(/\s/g, ''))}">${esc(c.telefono)}</a></dd>
      ${c.contacto ? `<dt>Contacto</dt><dd>${esc(c.contacto)}</dd>` : ''}
      <dt>Responsable</dt><dd>${esc(a.titulo + ' ' + a.nombre)}</dd>
      <dt>Documento</dt><dd>${esc(c.documento)}</dd>
      <dt>Cliente desde</dt><dd>${dfDate.format(parse(c.desde))}</dd>
    </dl>
    <section class="cases" aria-label="Expedientes">
      <h3>Expedientes (${c.casos.length})</h3>
      ${c.casos.length ? c.casos.map((k) => `<div class="case">${status(k.estado === 'Cerrado' ? 'Inactivo' : 'Activo')}<span>${esc(k.titulo)}<small>${esc(k.expediente)}, ${esc(k.estado.toLowerCase())}</small></span><span class="prio" ${k.prioridad === 'Alta' ? 'data-high' : ''}>Prioridad ${k.prioridad.toLowerCase()}</span></div>`).join('') : '<p class="notes">Todavía no tiene expedientes.</p>'}
    </section>
    ${c.notas ? `<p class="notes">${esc(c.notas)}</p>` : ''}`;
  peek.hidden = false;
  peek.setAttribute('aria-labelledby', 'peekTitle');
  document.title = `${c.nombre} | Lex & Asociados`;
}

function open(id) {
  const wasOpen = !!state.open;
  state.open = id;
  render(); renderPeek();
  const peek = $('#peek');
  if (wasOpen) { peek.style.animation = 'none'; void peek.offsetWidth; peek.style.animation = ''; }
  $('[data-close]', peek)?.focus({ preventScroll: true });
}
function close() {
  if (!state.open) return false;
  const id = state.open;
  state.open = null;
  render(); renderPeek();
  document.querySelector(`.row[data-id="${id}"]`)?.focus({ preventScroll: true });
  return true;
}

/* ---------- Avisos ---------- */
function toast(msg, action) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span>${msg}</span>${action ? `<button type="button">${esc(action.label)}</button>` : ''}`;
  if (action) el.querySelector('button').onclick = () => { action.fn(); el.remove(); };
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

/* ---------- Eventos ---------- */
$('#q').addEventListener('input', (e) => { state.q = e.target.value.trim(); render(); });
document.addEventListener('click', (e) => {
  const t = e.target;
  let el;
  if ((el = t.closest('[data-tab]'))) { state.tab = el.dataset.tab; render(); return; }
  if ((el = t.closest('.row[data-id]'))) { open(el.dataset.id); return; }
  if (t.closest('[data-close]')) { close(); return; }
  if (t.closest('[data-clear]')) { $('#q').value = ''; state.q = ''; render(); $('#q').focus(); return; }
  if ((el = t.closest('[data-remind]'))) {
    const id = el.dataset.remind;
    const c = clients.find((x) => x.id === id);
    if (reminders[id]) { delete reminders[id]; save(); renderPeek(); $('[data-remind]')?.focus(); toast('Quitaste el recordatorio.'); return; }
    reminders[id] = true; save(); renderPeek(); $('[data-remind]')?.focus();
    toast(`Te recordaremos la audiencia de <b>${esc(c.nombre)}</b> el día antes.`, { label: 'Deshacer', fn: () => { delete reminders[id]; save(); renderPeek(); } });
    return;
  }
  if ((el = t.closest('[data-soon]'))) { toast(`La sección <b>${esc(el.dataset.soon)}</b> todavía no está disponible.`); }
});

document.addEventListener('keydown', (e) => {
  const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName);
  if ($('#newDialog').open) return;
  if (e.key === 'Escape') {
    if (close()) return;
    if (state.q) { $('#q').value = ''; state.q = ''; render(); }
    return;
  }
  if (e.key === '/' && !typing) { e.preventDefault(); $('#q').focus(); return; }
  // Flechas para moverse por la lista
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && (e.target.closest('.row') || e.target.id === 'q')) {
    const rows = [...document.querySelectorAll('#list .row')];
    if (!rows.length) return;
    e.preventDefault();
    const i = rows.indexOf(e.target.closest('.row'));
    const next = e.key === 'ArrowDown' ? rows[Math.min(rows.length - 1, i + 1)] : rows[Math.max(0, i - 1)];
    next.focus();
  }
});

/* ---------- Nuevo cliente ---------- */
const dlg = $('#newDialog');
const form = $('#newForm');
$('#fArea').innerHTML = Object.keys(D.AREAS).map((a) => `<option>${esc(a)}</option>`).join('');
$('#newBtn').addEventListener('click', () => { form.reset(); form.querySelectorAll('[data-invalid]').forEach((l) => l.removeAttribute('data-invalid')); dlg.showModal(); });
$('#cancelNew').addEventListener('click', () => dlg.close());
form.addEventListener('input', (e) => e.target.closest('label')?.removeAttribute('data-invalid'));
// Sin depender del evento submit: los visores aislados (iframes sin allow-forms) lo bloquean
form.addEventListener('submit', (e) => e.preventDefault());
form.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); createClient(); } });
$('#createBtn').addEventListener('click', createClient);
function createClient() {
  const nombre = form.nombre.value.trim(), email = form.email.value.trim();
  const bad = [];
  if (nombre.length < 3) bad.push('lNombre');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) bad.push('lEmail');
  bad.forEach((id) => $('#' + id).setAttribute('data-invalid', ''));
  if (bad.length) { $('#' + bad[0] + ' input').focus(); return; }
  const c = {
    id: 'c' + Date.now().toString(36), nombre, tipo: 'Empresa', area: form.area.value, estado: 'Potencial', abogado: 'ev', contacto: '',
    email, telefono: 'Sin teléfono', ciudad: 'Bogotá', documento: 'Sin documento', desde: HOY, ultimaActividad: HOY,
    proximaAudiencia: null, facturado: 0, pendiente: 0, satisfaccion: 5, favorito: false, etiquetas: [], casos: [], notas: '',
    timeline: [{ fecha: HOY, texto: 'Cliente creado' }],
  };
  clients.unshift(c); save(); dlg.close();
  state.q = ''; $('#q').value = ''; state.tab = 'todos';
  open(c.id);
  toast(`Creaste el cliente <b>${esc(nombre)}</b>.`);
}

render();
renderPeek();

</script>
